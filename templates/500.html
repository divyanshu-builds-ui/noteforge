{% extends "base.html" %}
{% block title %}500 — Server Error{% endblock %}

{% block head %}
<style>
    .error-page {
        text-align: center;
        padding: 80px 24px;
        max-width: 550px;
        margin: 0 auto;
        min-height: 70vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
    }
    .error-illustration {
        position: relative;
        margin-bottom: 32px;
    }
    .error-emoji {
        font-size: 5rem;
        display: inline-block;
        animation: shake 2s ease-in-out infinite;
    }
    @keyframes shake {
        0%, 100% { transform: rotate(0deg); }
        10% { transform: rotate(-5deg); }
        20% { transform: rotate(5deg); }
        30% { transform: rotate(-3deg); }
        40% { transform: rotate(3deg); }
        50% { transform: rotate(0deg); }
    }
    .error-sparks {
        position: absolute;
        top: -5px; right: -5px;
        font-size: 1.5rem;
        animation: blink 1s ease-in-out infinite;
    }
    @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.2; }
    }
    .error-code {
        font-family: 'Space Grotesk', sans-serif;
        font-size: 7rem;
        font-weight: 700;
        background: linear-gradient(135deg, #ef4444, #f97316, #eab308);
        background-size: 200% 200%;
        animation: gradientShift 3s ease infinite;
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        line-height: 1;
        margin-bottom: 16px;
    }
    @keyframes gradientShift {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
    }
    .error-title {
        font-size: 1.5rem;
        color: var(--text);
        margin-bottom: 12px;
        font-weight: 600;
    }
    .error-desc {
        color: var(--text-muted);
        font-size: 0.95rem;
        line-height: 1.7;
        margin-bottom: 32px;
    }
    .error-actions {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        justify-content: center;
    }
</style>
{% endblock %}

{% block content %}
<section class="error-page">
    <div class="error-illustration">
        <div class="error-emoji">🔧</div>
        <div class="error-sparks">⚡</div>
    </div>
    <div class="error-code">500</div>
    <h1 class="error-title">Something went wrong</h1>
    <p class="error-desc">Our server hit an unexpected error. This is on us, not you. Try again in a moment or head back home.</p>
    <div class="error-actions">
        <a href="/" class="btn btn-primary">← Back to Home</a>
        <button class="btn btn-outline" onclick="window.location.reload()">🔄 Try Again</button>
    </div>
</section>
{% endblock %}
